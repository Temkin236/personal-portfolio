    <style>
        :root {
            /* Silent / neutral light brand */
            --bg: #fbfbfc; /* page background */
            --surface: #f7f7f8; /* section surface */
            --card: #ffffff; /* card backgrounds */
            --text: #0f1724; /* primary text (deep slate) */
            --muted: #6b7280; /* subtle muted text */
            --accent: #111827; /* quiet accent */
            --success: #10b981;
            --border: rgba(15,23,36,0.06);
            --brand-ease: cubic-bezier(0.2, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Hardware Accelerated Grain Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            will-change: opacity;
        }

        .font-heading { font-family: 'Space Grotesk', sans-serif; }

        ::selection { background: #000; color: #fff; }

        /* Ensure any Tailwind 'blue' utilities fallback to quiet accent */
        a, .text-blue-500, .text-sky-500, .text-indigo-500, .text-indigo-600 { color: var(--accent) !important; }
        .bg-blue-500, .bg-sky-500, .bg-indigo-500, .bg-indigo-600 { background-color: var(--surface) !important; }
        .ring-blue-500, .ring-indigo-500 { box-shadow: 0 0 0 4px rgba(15,23,36,0.06) !important; }

        /* neutralize Tailwind link outlines for consistent flow */
        a:focus, a:active { outline-color: transparent; }

        /* Animation System - Production Refined */
        .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.99);
            transition: opacity 1s var(--brand-ease), transform 1s var(--brand-ease);
            will-change: transform, opacity;
        }
        .reveal.active { opacity: 1; transform: translateY(0) scale(1); }

        .outline-text {
            -webkit-text-stroke: 1px rgba(0,0,0,0.08);
            color: transparent;
            transition: all 0.8s var(--brand-ease);
        }
        .group:hover .outline-text { -webkit-text-stroke: 1px rgba(0,0,0,1); }

        /* Smooth scroll margin for anchors */
        section { scroll-margin-top: 100px; }

        /* Map common Tailwind utilities to the silent brand variables */
        .bg-white { background-color: var(--card) !important; }
        .bg-neutral-50 { background-color: var(--surface) !important; }
        .bg-neutral-100 { background-color: rgba(15,23,36,0.02) !important; }

        .text-black { color: var(--text) !important; }
        .text-neutral-300, .text-neutral-400, .text-neutral-500 { color: var(--muted) !important; }

        .border-neutral-100, .border-neutral-200 { border-color: var(--border) !important; }

        .bg-black { background-color: var(--accent) !important; color: #fff !important; }
        .text-white { color: #fff !important; }

        /* Hide scrollbars for horizontal scroll areas */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* Enhanced scroll snap for better UX */
        .scroll-snap-x {
            scroll-snap-type: x mandatory;
        }
        .scroll-snap-start {
            scroll-snap-align: start;
        }

        /* Custom smooth scrolling with momentum */
        .horizontal-scroll {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            will-change: scroll-position;
        }

        /* Smooth transitions for all interactive elements */
        .smooth-all {
            transition: all 0.3s var(--brand-ease);
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .reveal, .animate-in, .transition-all {
                animation: none !important;
                transition: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }

        /* Custom Animations */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 15s linear infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-10px) rotate(-1deg); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }

        @keyframes scroll {
            0% { transform: translateY(0); }
            50% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }
        .animate-scroll { animation: scroll 2s ease-in-out infinite; }

        /* One-page layout enhancements */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        /* Section transitions - compact design */
        section {
            position: relative;
        }

        section#home {
            min-height: 100vh;
        }

        section:not(#home) {
            padding: 2rem 0;
        }

        @media (min-width: 768px) {
            section:not(#home) {
                padding: 2.5rem 0;
            }
        }

        /* Glass morphism effect */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Parallax effect on scroll */
        .parallax {
            transform: translateZ(0);
            will-change: transform;
        }

        /* Loading animation */
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #111827;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fade in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        /* Install PWA prompt */
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 15px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, 100px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .install-prompt.show {
            display: flex;
        }

        .install-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .install-btn:hover {
            transform: scale(1.05);
        }
    </style>
    <script type="importmap">

<body class="antialiased selection:bg-black selection:text-white">
    <!-- Loading indicator -->
    <div id="loading" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fbfbfc; z-index: 9999;">
        <div class="loading-spinner"></div>
    </div>

    <!-- Install PWA prompt -->
    <div id="install-prompt" class="install-prompt">
        <span>📱 Install app for better experience</span>
        <button id="install-btn" class="install-btn">Install</button>
        <button id="dismiss-btn" class="install-btn" style="background: transparent; color: white; border: 1px solid white;">Dismiss</button>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
        // Remove loading indicator when page loads
        window.addEventListener('load', () => {
            const loader = document.getElementById('loading');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.3s';
                setTimeout(() => loader.remove(), 300);
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'activated') {
                                    if (confirm('New version available! Reload to update?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(error => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('install-prompt');
        const installBtn = document.getElementById('install-btn');
        const dismissBtn = document.getElementById('dismiss-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Show install prompt after 3 seconds
            setTimeout(() => {
                if (!localStorage.getItem('pwa-dismissed')) {
                    installPrompt.classList.add('show');
                }
            }, 3000);
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                console.log('✅ PWA installed');
            }
            
            deferredPrompt = null;
            installPrompt.classList.remove('show');
        });

        dismissBtn.addEventListener('click', () => {
            installPrompt.classList.remove('show');
            localStorage.setItem('pwa-dismissed', 'true');
        });

        // Smooth scroll behavior
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });

            // Intersection Observer for fade-in animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('fade-in');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            // Observe all sections
            document.querySelectorAll('section').forEach(section => {
                observer.observe(section);
            });
        });

        // Network status indicator
        window.addEventListener('online', () => {
            console.log('✅ Back online');
        });

        window.addEventListener('offline', () => {
            console.log('❌ No internet connection');
        });
    </script>

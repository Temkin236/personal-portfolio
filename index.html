
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR | Full Stack & Agentic AI Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --noir-ease: cubic-bezier(0.2, 1, 0.3, 1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Hardware Accelerated Grain Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            will-change: opacity;
        }

        .font-heading { font-family: 'Space Grotesk', sans-serif; }

        ::selection { background: #000; color: #fff; }

        /* Animation System - Production Refined */
        .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.99);
            transition: opacity 1s var(--noir-ease), transform 1s var(--noir-ease);
            will-change: transform, opacity;
        }
        .reveal.active { opacity: 1; transform: translateY(0) scale(1); }

        .outline-text {
            -webkit-text-stroke: 1px rgba(0,0,0,0.15);
            color: transparent;
            transition: all 0.8s var(--noir-ease);
        }
        .group:hover .outline-text { -webkit-text-stroke: 1px rgba(0,0,0,1); }

        /* Smooth scroll margin for anchors */
        section { scroll-margin-top: 100px; }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .reveal, .animate-in, .transition-all {
                animation: none !important;
                transition: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }

        /* Custom Animations */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 15s linear infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-10px) rotate(-1deg); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
</head>
<body class="antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
</body>
</html>

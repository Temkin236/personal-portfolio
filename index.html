
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temkin Abdulmelik | Agentic AI Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Silent / neutral light brand */
            --bg: #fbfbfc; /* page background */
            --surface: #f7f7f8; /* section surface */
            --card: #ffffff; /* card backgrounds */
            --text: #0f1724; /* primary text (deep slate) */
            --muted: #6b7280; /* subtle muted text */
            --accent: #111827; /* quiet accent */
            --success: #10b981;
            --border: rgba(15,23,36,0.06);
            --brand-ease: cubic-bezier(0.2, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Hardware Accelerated Grain Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            will-change: opacity;
        }

        .font-heading { font-family: 'Space Grotesk', sans-serif; }

        ::selection { background: #000; color: #fff; }

        /* Ensure any Tailwind 'blue' utilities fallback to quiet accent */
        a, .text-blue-500, .text-sky-500, .text-indigo-500, .text-indigo-600 { color: var(--accent) !important; }
        .bg-blue-500, .bg-sky-500, .bg-indigo-500, .bg-indigo-600 { background-color: var(--surface) !important; }
        .ring-blue-500, .ring-indigo-500 { box-shadow: 0 0 0 4px rgba(15,23,36,0.06) !important; }

        /* neutralize Tailwind link outlines for consistent flow */
        a:focus, a:active { outline-color: transparent; }

        /* Animation System - Production Refined */
        .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.99);
            transition: opacity 1s var(--brand-ease), transform 1s var(--brand-ease);
            will-change: transform, opacity;
        }
        .reveal.active { opacity: 1; transform: translateY(0) scale(1); }

        .outline-text {
            -webkit-text-stroke: 1px rgba(0,0,0,0.08);
            color: transparent;
            transition: all 0.8s var(--brand-ease);
        }
        .group:hover .outline-text { -webkit-text-stroke: 1px rgba(0,0,0,1); }

        /* Smooth scroll margin for anchors */
        section { scroll-margin-top: 100px; }

        /* Map common Tailwind utilities to the silent brand variables */
        .bg-white { background-color: var(--card) !important; }
        .bg-neutral-50 { background-color: var(--surface) !important; }
        .bg-neutral-100 { background-color: rgba(15,23,36,0.02) !important; }

        .text-black { color: var(--text) !important; }
        .text-neutral-300, .text-neutral-400, .text-neutral-500 { color: var(--muted) !important; }

        .border-neutral-100, .border-neutral-200 { border-color: var(--border) !important; }

        .bg-black { background-color: var(--accent) !important; color: #fff !important; }
        .text-white { color: #fff !important; }

        /* Hide scrollbars for horizontal scroll areas */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* Enhanced scroll snap for better UX */
        .scroll-snap-x {
            scroll-snap-type: x mandatory;
        }
        .scroll-snap-start {
            scroll-snap-align: start;
        }

        /* Custom smooth scrolling with momentum */
        .horizontal-scroll {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            will-change: scroll-position;
        }

        /* Smooth transitions for all interactive elements */
        .smooth-all {
            transition: all 0.3s var(--brand-ease);
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .reveal, .animate-in, .transition-all {
                animation: none !important;
                transition: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }

        /* Custom Animations */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 15s linear infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-10px) rotate(-1deg); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
</head>
<body class="antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
